[versions]
agp = "9.4.1"
kotlin = "2.4.10"
ksp = "2.3.11"
hilt = "2.60.1"
wearCompose = "1.6.2"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
jellyfinSdk = "1.8.12"
coroutines = "1.10.2"
okhttp = "5.3.2"
junit = "4.13.2"
slf4j = "2.0.18"
securityCrypto = "1.1.0"
hiltNavigationCompose = "1.4.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
room = "2.8.4"
# Pinned to the version Horologist 0.7.15 is compiled against: mixing
# media3 1.11 with AARs compiled for 1.7.1 risks silent ABI breaks.
media3 = "1.7.1"
horologist = "0.7.15"
work = "2.11.2"
hiltExt = "1.4.0"
datastore = "1.2.1"
coil = "3.6.3"
wearTiles = "1.6.2"
wearProtolayout = "1.4.2"
wearOngoing = "1.1.0"
coreKtx = "1.19.0"
turbine = "1.2.1"
playServicesWearable = "19.0.0"
navigationCompose = "2.9.3"
kotlinxSerializationJson = "1.9.0"   # aligned with the version resolved by the Jellyfin SDK (verified: app:dependencyInsight)

[libraries]
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# Material vector icons — versions provided by the Compose BOM (no version.ref).
# -core covers common icons, -extended the rest; R8 prunes unused icons in release.
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
jellyfin-core = { group = "org.jellyfin.sdk", name = "jellyfin-core", version.ref = "jellyfinSdk" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Room — local catalog (collections, tracks, download queue, sync log).
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Media3 — download engine (DownloadManager/Cache) and playback (ExoPlayer/MediaSession).
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
media3-exoplayer-workmanager = { group = "androidx.media3", name = "media3-exoplayer-workmanager", version.ref = "media3" }

# Horologist — Wear OS building blocks not worth re-implementing (audio offload, speaker guard,
# Output Switcher, high-bandwidth network acquisition). `horologist-media-data` is
# deliberately excluded: it bundles its own Room 2.7 database that would collide
# with ours — Media3's `DownloadService` is extended directly.
horologist-media3-backend = { group = "com.google.android.horologist", name = "horologist-media3-backend", version.ref = "horologist" }
horologist-media3-outputswitcher = { group = "com.google.android.horologist", name = "horologist-media3-outputswitcher", version.ref = "horologist" }
horologist-audio = { group = "com.google.android.horologist", name = "horologist-audio", version.ref = "horologist" }
horologist-network-awareness = { group = "com.google.android.horologist", name = "horologist-network-awareness", version.ref = "horologist" }

# WorkManager — sync pipeline under constraints (charging + Wi-Fi).
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltExt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltExt" }

# DataStore — settings (quota, sync constraints, periodicity).
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coil 3 — cover art, with disk cache for offline display.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Wear OS extras — "Resume playback" Tile and Ongoing Activity.
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "wearProtolayout" }
wear-protolayout-material3 = { group = "androidx.wear.protolayout", name = "protolayout-material3", version.ref = "wearProtolayout" }
wear-ongoing = { group = "androidx.wear", name = "wear-ongoing", version.ref = "wearOngoing" }

turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
# ── Companion modules (:core + :mobile) ─────────────────────────────────────────────
# play-services-wearable : Wearable Data Layer (MessageClient/CapabilityClient).
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# Material3 phone (the watch uses wear.compose) — version provided by the Compose BOM.
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
