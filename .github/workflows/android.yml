name: Android CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Public hygiene scan
        run: bash ./scripts/check-public-hygiene.sh

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Resolve Android SDK location
        run: echo "ANDROID_SDK_DIR=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      # The android-37.0 platform is not preinstalled on the runner image, so every
      # run re-downloaded it. Cache it under a fixed key: one entry, reused by all runs.
      - name: Cache Android SDK platform android-37.0
        id: android-sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.ANDROID_SDK_DIR }}/platforms/android-37.0
            ~/.android/licenses
          key: android-sdk-platform-android-37.0

      - name: Provision Android SDK (platform android-37.0 not preinstalled on runner)
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Build release APK (R8, unsigned on CI)
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellywrist-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload release APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellywrist-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload mobile debug APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellywrist-mobile-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload mobile release APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellywrist-mobile-release-apk
          path: mobile/build/outputs/apk/release/*.apk
          retention-days: 7
